[package]
name = "forza-gallery-sync"
version = "0.2.1"
description = "Forza Horizon 照片同步工具桌面版"
authors = ["forza-sync contributors"]
edition = "2021"

[lib]
name = "forza_gallery_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.23", features = ["auto-initialize"] }
