name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt . nuitka
          # 记录 Python 安装根目录，供打包脚本使用（标准 CPython：DLLs/sqlite3.dll）
          $py = (Get-Command python).Source
          $pyHome = Split-Path $py -Parent
          "PY_HOME=$pyHome" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compute version and release tag
        id: meta
        shell: pwsh
        run: |
          $cfg = Get-Content pyproject.toml -Raw
          if ($cfg -match 'version\s*=\s*"([^"]+)"') { $version = $Matches[1] } else { $version = "0.0.0" }
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            # tag 触发（如 v0.4.0）：发布到该 tag
            $releaseTag = $env:GITHUB_REF_NAME
          } else {
            # 手动触发：使用 版本号-短提交号 作为 tag
            $releaseTag = "$version-$shortSha"
          }

          # 版本号只有一个来源：pyproject.toml。这里交叉核对后端包版本，
          # 避免改了 pyproject 却忘了 __init__（界面显示的版本从程序集读，由 make-gui.ps1 从 $version 写入）。
          $init = Get-Content forza_sync/__init__.py -Raw -Encoding utf8
          if ($init -notmatch "__version__\s*=\s*`"$([regex]::Escape($version))`"") {
            throw "版本号不一致：pyproject.toml 是 $version，但 forza_sync/__init__.py 不是"
          }

          # tag 与工程版本号必须一致，否则会发出对不上号的包（发版前拦截）
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $version) {
              throw "tag ($($env:GITHUB_REF_NAME)) 与工程版本号 ($version) 不一致，请先把 pyproject.toml 的 version 改成 $tagVersion"
            }
            Write-Host "tag/版本一致性校验通过：$($env:GITHUB_REF_NAME) == $version"
          }
          "VERSION=$version"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "VERSION=$version  RELEASE_TAG=$releaseTag"

      - name: Prepare release body from CHANGELOG
        shell: pwsh
        run: |
          $version = $env:VERSION
          # 显式 UTF-8：不同 PowerShell 版本对无 BOM 文件的默认编码不同（PS 5.1 为 ANSI）
          $raw = Get-Content "CHANGELOG.md" -Raw -Encoding utf8
          $esc = [regex]::Escape($version)
          # 提取 "## [x.y.z] - 日期" 章节，直到下一个 "## " 或文件末尾
          $pattern = "(?ms)^##\s*\[?$esc\]?\s*(?:-\s*\d{4}-\d{2}-\d{2})?\s*\r?\n(.*?)(?=^##\s|\z)"
          $m = [regex]::Match($raw, $pattern)
          $section = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }

          $assets = @(
            "- **安装程序（推荐）**：ForzaGallerySync-$version-setup.exe（向导式、免管理员，装到 %LOCALAPPDATA%\Programs\ForzaGallerySync，自带开始菜单/桌面快捷方式与标准卸载入口）",
            "- 免安装版：ForzaGallerySync-$version-win-x64.zip（解压即用；首次运行自动准备 Python 运行时：程序目录为干净目录时解压到程序目录，否则解压到 %LOCALAPPDATA%\Programs\ForzaGallerySync）",
            "- CLI 单文件：forza-sync.exe（Nuitka 编译，自包含）",
            "",
            "程序内置自动更新会优先下载并静默运行与本机形态匹配的安装程序；无法使用时回退到增量更新或完整包。"
          )
          $header = "## Forza Gallery Sync $version"
          $crlf = "`r`n"
          if ($section) {
            $body = $header + $crlf + $crlf + ($assets -join $crlf) + $crlf + $crlf + $section
          } else {
            $body = $header + $crlf + $crlf + ($assets -join $crlf)
          }
          $bodyPath = Join-Path $env:RUNNER_TEMP "release-body.md"
          Set-Content -Path $bodyPath -Value $body -Encoding utf8
          "RELEASE_BODY_PATH=$bodyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Release body chars: $($section.Length)"

      - name: Build CLI single-file (Nuitka)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\web\make-cli.ps1 `
            -Python "$env:PY_HOME\python.exe" -Version $env:VERSION

      - name: Build GUI (self-contained folder + zip)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\web\make-gui.ps1 `
            -PythonEnv $env:PY_HOME -Version $env:VERSION

      # 标准 EXE 安装程序（Inno Setup）。装在 runner 自带的 chocolatey 里，
      # 装完 ISCC.exe 在 Program Files (x86)\Inno Setup 6，make-installer.ps1 会自动定位。
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install: $iscc" }
          Write-Host "ISCC: $iscc"

      - name: Build installer (EXE)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\web\make-installer.ps1 `
            -SourceDir "web/dist/ForzaGallerySync-$($env:VERSION)-win-x64" `
            -Version $env:VERSION `
            -OutputDir "web/dist"

      - name: Verify build outputs
        shell: pwsh
        run: |
          $gui = Get-ChildItem "web/dist/ForzaGallerySync-*-win-x64.zip" -ErrorAction SilentlyContinue
          $cli = Get-Item "cli-dist/forza-sync.exe" -ErrorAction SilentlyContinue
          $setup = Get-Item "web/dist/ForzaGallerySync-$($env:VERSION)-setup.exe" -ErrorAction SilentlyContinue
          if (-not $gui) { throw "GUI release zip not found: web/dist/ForzaGallerySync-*-win-x64.zip" }
          if (-not $cli) { throw "CLI single-file not found: cli-dist/forza-sync.exe" }
          if (-not $setup) { throw "Installer not found: web/dist/ForzaGallerySync-$($env:VERSION)-setup.exe" }
          foreach ($f in @($gui) + @($cli) + @($setup)) {
            Write-Host ("{0}  {1} MB" -f $f.Name, [math]::Round($f.Length / 1MB, 1))
          }

          # Assets 必须进发布目录：主窗口标题栏的图标来自 Assets/app-icon.png，
          # 而 <Content Include="Assets\**\*"/> 默认只落 bin、不进 publish（csproj 里已显式补进
          # ResolvedFileToPublish，这条断言防止以后又被改回去）。
          $icon = "web/dist/ForzaGallerySync-$($env:VERSION)-win-x64/Assets/app-icon.png"
          if (-not (Test-Path $icon)) { throw "Assets/app-icon.png missing from release folder: $icon" }
          Write-Host "Assets/app-icon.png present"

          # 内嵌运行时必须包含 forza_sync、requests 依赖链与 playwright
          # （playwright 缺失会导致打包版无法使用「浏览器一键登录」）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "web/python-runtime.zip"))
          $names = @($archive.Entries | ForEach-Object { $_.FullName })
          $archive.Dispose()
          if (-not ($names -match '^forza_sync[\\/]')) { throw "python-runtime.zip lacks the forza_sync package" }
          if (-not ($names -match 'site-packages[\\/]requests[\\/]')) { throw "python-runtime.zip lacks requests" }
          if (-not ($names -match 'site-packages[\\/]playwright[\\/]driver[\\/]node\.exe$')) {
            throw "python-runtime.zip lacks playwright (browser login would be unavailable)"
          }
          Write-Host "python-runtime.zip: $($names.Count) entries (forza_sync + requests + playwright)"

      - name: Verify version is embedded in the GUI binary
        shell: pwsh
        run: |
          # 程序集里的版本号必须等于 pyproject.toml 的版本（make-gui.ps1 用 -Version 注入）。
          # 这一步防的是"改了 pyproject 却忘了重新发布"→ 发出对不上号的包。
          $exe = "web/dist/ForzaGallerySync-$($env:VERSION)-win-x64/forza-gallery-sync.exe"
          if (-not (Test-Path $exe)) { throw "找不到发布出来的 exe: $exe" }

          $info = (Get-Item $exe).VersionInfo
          $embedded = ($info.FileVersion -split '\.')[0..2] -join '.'
          Write-Host "FileVersion=$($info.FileVersion)  ProductVersion=$($info.ProductVersion)  期望=$($env:VERSION)"
          if ($embedded -ne $env:VERSION) {
            throw "GUI 程序集版本 ($($info.FileVersion)) 与工程版本号 ($($env:VERSION)) 不一致"
          }

          # 后端包版本也必须一致（界面显示的版本来自 forza_sync）
          $init = Get-Content forza_sync/__init__.py -Raw -Encoding utf8
          if ($init -notmatch "__version__\s*=\s*`"$([regex]::Escape($env:VERSION))`"") {
            throw "forza_sync/__init__.py 的 __version__ 与 VERSION=$($env:VERSION) 不一致"
          }
          Write-Host "版本号一致性校验通过"

      # 增量更新资产：把发布目录里"体积大、且跨版本才变"的文件各自发布成 Release 资产，
      # 客户端更新时只下载这些文件，不必为基本不变的运行时（Python 77MB + .NET/WindowsSDK 182MB）
      # 每次重下 130MB 的完整包。生成逻辑放在 web/make-increment.ps1，CI 与本地共用同一实现
      # （本地可用它验证清单格式，不必等 CI）。
      - name: Build incremental assets (per-file, >=256KB)
        shell: pwsh
        run: |
          $incDir = Join-Path $env:RUNNER_TEMP "inc"
          powershell -ExecutionPolicy Bypass -File .\web\make-increment.ps1 `
            -SourceDir "web/dist/ForzaGallerySync-$($env:VERSION)-win-x64" `
            -Version $env:VERSION -OutputDir $incDir
          if ($LASTEXITCODE -ne 0) { throw "make-increment failed (exit $LASTEXITCODE)" }

          "INC_DIR=$incDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INC_MANIFEST=$(Join-Path $incDir "increment-$($env:VERSION).json")" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forza-gallery-sync-release
          path: |
            cli-dist/forza-sync.exe
            web/dist/ForzaGallerySync-*-win-x64.zip
            web/dist/ForzaGallerySync-*-setup.exe

      - name: Create / update GitHub Release (tags v* or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Forza Gallery Sync ${{ env.VERSION }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          files: |
            cli-dist/forza-sync.exe
            web/dist/ForzaGallerySync-*-setup.exe
            web/dist/ForzaGallerySync-*-win-x64.zip
            ${{ env.INC_DIR }}/ForzaGallerySync-inc-*.zip
            ${{ env.INC_MANIFEST }}
          draft: false
          prerelease: false

      # 把产物哈希发布到独立的 `hashes` 分支：
      #   - 独立分支不会随 git clone 下到 working tree，仓库不会因历次哈希而膨胀；
      #   - 客户端用 raw URL 直接取清单校验下载到的更新包，不消耗 GitHub API 配额；
      #   - 每版两个清单：`<版本>.txt`（规范格式：每行 "<sha256>  <文件名>"）与
      #     `hashes.json`（带版本与体积，供客户端优先读取）。
      #
      # 注意：**不要用 git push 更新该分支**。实测 runner 上 token 拼进 URL 会被
      # "Password authentication is not supported" 拒绝，`gh auth setup-git` 又需要
      # /dev/tty 而失败（bash: /dev/tty: No such device or address）。改用 REST API
      # 单文件提交，只需要 contents:write 权限，不依赖 git 凭证配置。
      - name: Publish artifact hashes to `hashes` branch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION
          $records = [ordered]@{}
          $manifestLines = @()
          $files = @()
          $files += Get-ChildItem "web/dist/ForzaGallerySync-*-win-x64.zip"
          # 安装包也要进哈希清单：它是主要交付物之一，SHA256 必须可校验
          $setup = Get-Item "web/dist/ForzaGallerySync-$version-setup.exe" -ErrorAction SilentlyContinue
          if ($setup) { $files += $setup }
          $cli = Get-Item "cli-dist/forza-sync.exe" -ErrorAction SilentlyContinue
          if ($cli) { $files += $cli }

          foreach ($f in $files) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower()
            $records[$f.Name] = @{
              sha256 = $h
              size   = $f.Length
            }
            # 规范格式：两个空格分隔（与 sha256sum 输出一致）
            $manifestLines += "$h  $($f.Name)"
            Write-Host "$($f.Name)  $h"
          }
          if ($manifestLines.Count -eq 0) { throw "没有任何产物可计算哈希" }

          $payload = [ordered]@{
            version   = $version
            generated = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            artifacts = $records
          }

          # 无 BOM：客户端按 UTF-8 解析，BOM 会破坏 JSON 解析
          $json = ($payload | ConvertTo-Json -Depth 5)
          $jsonPath = Join-Path $env:RUNNER_TEMP "hashes.json"
          [System.IO.File]::WriteAllText($jsonPath, $json, (New-Object System.Text.UTF8Encoding($false)))

          $txtPath = Join-Path $env:RUNNER_TEMP "$version.txt"
          $txt = ($manifestLines -join "`n") + "`n"
          [System.IO.File]::WriteAllText($txtPath, $txt, (New-Object System.Text.UTF8Encoding($false)))

          Write-Host "--- $version.txt ---"
          Write-Host $txt

          # 上传一个文件到 hashes 分支：已存在时必须带上现有 blob 的 sha
          function Publish-File {
            param([string]$LocalPath, [string]$RepoPath, [string]$Message)

            $existingSha = $null
            try {
              $existingSha = (gh api "repos/$env:GITHUB_REPOSITORY/contents/${RepoPath}?ref=hashes" --jq '.sha' 2>$null)
            } catch {
              $existingSha = $null
            }
            if ([string]::IsNullOrWhiteSpace($existingSha)) { $existingSha = $null }

            $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($LocalPath))
            $body = [ordered]@{
              message = $Message
              content = $content
              branch  = "hashes"
            }
            if ($existingSha) { $body["sha"] = $existingSha }

            $bodyPath = Join-Path $env:RUNNER_TEMP "gh-body.json"
            [IO.File]::WriteAllText($bodyPath, ($body | ConvertTo-Json -Compress), (New-Object System.Text.UTF8Encoding($false)))

            gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/$RepoPath" --input $bodyPath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "发布 $RepoPath 到 hashes 分支失败（gh exit $LASTEXITCODE）" }
            Write-Host "已发布 $RepoPath（$(if ($existingSha) { "更新 $($existingSha.Substring(0,7))" } else { "新建" })）"
          }

          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $version }
          $msg = "hashes: $tag"
          Publish-File -LocalPath $txtPath   -RepoPath "$version.txt"    -Message $msg
          Publish-File -LocalPath $jsonPath  -RepoPath "hashes.json"     -Message $msg
          # 增量更新清单：客户端先取它，用来判断本地哪些文件已经是最新的
          if ($env:INC_MANIFEST -and (Test-Path $env:INC_MANIFEST)) {
            Publish-File -LocalPath $env:INC_MANIFEST -RepoPath "increment.json" -Message $msg
          } else {
            Write-Host "警告：没有增量清单可发布（$env:INC_MANIFEST）"
          }

          # 回读校验：确认远端内容与本地算出的哈希一致（不看返回值，直接问 API）
          $verifyTxt = gh api "repos/$env:GITHUB_REPOSITORY/contents/$version.txt?ref=hashes" --jq '.content'
          $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($verifyTxt -replace '\s', '')))
          $expectedFirst = $manifestLines[0]
          if (-not $decoded.Contains($expectedFirst)) {
            throw "$version.txt 回读校验失败：远端内容与本地哈希不一致"
          }
          Write-Host "$version.txt 已回读校验通过（$($manifestLines.Count) 行）"
        env:
          GH_TOKEN: ${{ github.token }}


