[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forza-gallery-sync"
version = "0.4.0"
description = "Forza Horizon 照片自动同步工具：通过 Forza Gallery API 下载并备份照片"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "forza-sync contributors" }]
dependencies = [
    "requests>=2.28",
    "certifi>=2024.7.4",
    "playwright>=1.40",
]

[project.scripts]
forza-sync = "forza_sync.cli:main"

[tool.setuptools.packages.find]
include = ["forza_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
